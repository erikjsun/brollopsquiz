<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vem av oss? – Scen</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/stage.css">
</head>
<body class="stage-body" data-screen="intro" data-phase="ask">

  <div class="backdrop" aria-hidden="true">
    <div class="glow glow-tilda"></div>
    <div class="glow glow-oliver"></div>
    <div class="glow glow-center"></div>
    <div class="petals" id="petals"></div>
  </div>

  <!-- Guldram med kvistar i hörnen -->
  <div class="frame" aria-hidden="true">
    <svg class="sprig tl" viewBox="0 0 120 120"><use href="#sprig"/></svg>
    <svg class="sprig tr" viewBox="0 0 120 120"><use href="#sprig"/></svg>
    <svg class="sprig bl" viewBox="0 0 120 120"><use href="#sprig"/></svg>
    <svg class="sprig br" viewBox="0 0 120 120"><use href="#sprig"/></svg>
  </div>

  <header class="topbar"><span class="script">Vem av oss?</span></header>

  <div class="portraits">
    <figure class="portrait" data-person="tilda">
      <div class="arch">
        <div class="arch-inner">
          <img alt="" draggable="false">
          <div class="monogram serif">T</div>
        </div>
        <div class="badge" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.2 0 3.7 1.3 4.5 2.6.8-1.3 2.3-2.6 4.5-2.6 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg></div>
      </div>
      <figcaption>
        <span class="name script">Tilda</span>
        <span class="tally"></span>
      </figcaption>
    </figure>

    <div class="amp script" aria-hidden="true">&amp;</div>

    <figure class="portrait" data-person="oliver">
      <div class="arch">
        <div class="arch-inner">
          <img alt="" draggable="false">
          <div class="monogram serif">O</div>
        </div>
        <div class="badge" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.2 0 3.7 1.3 4.5 2.6.8-1.3 2.3-2.6 4.5-2.6 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg></div>
      </div>
      <figcaption>
        <span class="name script">Oliver</span>
        <span class="tally"></span>
      </figcaption>
    </figure>
  </div>

  <main id="scene" aria-live="polite"></main>

  <footer class="progress" id="progress" aria-hidden="true"></footer>

  <div class="pause" id="pause" aria-hidden="true">
    <div class="pause-inner">
      <div class="pause-mono serif">O <span class="script">&amp;</span> T</div>
      <div class="pause-text">Strax fortsätter vi …</div>
    </div>
  </div>

  <canvas id="confetti" aria-hidden="true"></canvas>

  <div class="hint" id="hint">
    <kbd>F</kbd> helskärm · <kbd>→</kbd>/<kbd>Mellanslag</kbd> nästa · <kbd>←</kbd> bakåt · <kbd>B</kbd> paus
  </div>

  <!-- SVG-symboler -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="sprig" viewBox="0 0 120 120">
        <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
          <path d="M6 6 C 30 20, 50 40, 70 80 S 100 112, 114 114"/>
          <path d="M6 6 C 20 30, 26 52, 24 78"/>
        </g>
        <g fill="currentColor" opacity=".85">
          <ellipse cx="28" cy="22" rx="9" ry="3.6" transform="rotate(35 28 22)"/>
          <ellipse cx="22" cy="34" rx="9" ry="3.6" transform="rotate(-60 22 34)"/>
          <ellipse cx="46" cy="38" rx="10" ry="4" transform="rotate(45 46 38)"/>
          <ellipse cx="40" cy="54" rx="10" ry="4" transform="rotate(-40 40 54)"/>
          <ellipse cx="62" cy="62" rx="10" ry="4" transform="rotate(60 62 62)"/>
          <ellipse cx="56" cy="78" rx="10" ry="4" transform="rotate(-25 56 78)"/>
          <ellipse cx="82" cy="92" rx="9" ry="3.6" transform="rotate(20 82 92)"/>
          <ellipse cx="18" cy="56" rx="8" ry="3.2" transform="rotate(80 18 56)"/>
          <ellipse cx="30" cy="66" rx="8" ry="3.2" transform="rotate(10 30 66)"/>
        </g>
        <circle cx="114" cy="114" r="3" fill="currentColor"/>
        <circle cx="24" cy="80" r="2.4" fill="currentColor"/>
      </symbol>
      <symbol id="flourish" viewBox="0 0 200 20">
        <g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
          <path d="M4 10 H 80"/>
          <path d="M120 10 H 196"/>
          <path d="M80 10 C 88 2, 96 2, 100 10 C 104 18, 112 18, 120 10"/>
          <path d="M80 10 C 88 18, 96 18, 100 10 C 104 2, 112 2, 120 10"/>
        </g>
        <circle cx="100" cy="10" r="2.2" fill="currentColor"/>
      </symbol>
      <symbol id="mic" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2.5" width="6" height="12" rx="3"/>
          <path d="M5.5 11a6.5 6.5 0 0 0 13 0"/>
          <path d="M12 17.5V21.5M8.5 21.5h7"/>
        </g>
      </symbol>
    </defs>
  </svg>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/stage.js"></script>
</body>
</html>
